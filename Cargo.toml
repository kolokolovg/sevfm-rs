[package]
name = "sevfm"
version = "0.1.0"
edition = "2024"
description = "Настольный плеер онлайн-радио «Говорит Севастополь»"
license = "Apache-2.0"
repository = "https://github.com/kolokolovg/sevfm-rs"
authors = ["Gleb Kolokolov"]

[dependencies]
# HTTP/TLS: синхронный, тело ответа — Read (стриминговое чтение), TLS —
# rustls с корнями webpki. Только явные фичи: gzip отключён (design D1 —
# радио-MP3 не сжимается, лишняя поверхность ни к чему), редиректы не
# нужны (max_redirects(0) в коде). Фаза 1 читает чистый MP3, без ICY.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# MP3-декодер: стриминговый probe → покадровый next_packet/decode (без Seek,
# в отличие от rodio::Decoder). Включены только MP3 и SIMD-оптимизации.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "opt-simd"] }
# Аудиовывод (rodio 0.23: DeviceSink + Player), конвертация формата
# источника в формат устройства. Декодеры rodio не нужны — источник
# сэмплов свой (pipeline.rs).
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# SIGINT/SIGTERM → атомарный флаг остановки (feature termination добавляет SIGTERM).
ctrlc = { version = "3.5", features = ["termination"] }
# Ошибки: derive Display/Error для enum'ов ошибок. Только compile-time
# (proc-macro), рантайм-зависимостей не добавляет; с фазой ICY число
# enum'ов вырастет — бойлерплейт ручных impl держим под нулём.
thiserror = "2"
# Разбор JSON внутри StreamTitle (ICY-метаданные): недоверенный и бывает
# обрезанным — самописный сканер повторял бы баг-поверхность библиотеки.
# Достаточно Value-доступа к полям, derive-фича serde не нужна.
serde_json = { version = "1", default-features = false, features = ["std"] }
# Окно плеера (design D4/D7 add-player-ui): дефолтные фичи — backend-winit
# + renderer-femtovg (на Linux), accessibility/system-tray осознанно
# принимаются; software-рендерер остаётся запасным через SLINT_BACKEND.
# Лицензия GPL-3.0/royalty-free — выбор «Rust + Slint» зафиксирован
# проектом для личного плеера. Разметка — ui/player-window.slint,
# компиляция — build.rs; lib от Slint не зависит, только bin.
slint = "1.18"

[build-dependencies]
# Компиляция .slint-разметки окна в build-скрипте (версия в sync с slint).
slint-build = "1.18"

[dev-dependencies]
# Property-based-тесты парсера ICY-метаблоков: скилл rust-clean-code
# прямо называет ICY-метаблоки целью PBT фазы 2 (инвариант кадрировщика,
# отсутствие паник парсера на произвольных байтах).
proptest = "1"
