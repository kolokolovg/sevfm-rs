[package]
name = "sevfm"
version = "0.1.1"
edition = "2024"
description = "Настольный плеер онлайн-радио «Говорит Севастополь»"
license = "Apache-2.0"
repository = "https://github.com/kolokolovg/sevfm-rs"
authors = ["Gleb Kolokolov"]

[dependencies]
# HTTP/TLS: синхронный, тело ответа — Read (стриминговое чтение), TLS —
# rustls с корнями webpki. Только явные фичи: gzip отключён (design D1 —
# радио-MP3 не сжимается, лишняя поверхность ни к чему), редиректы не
# нужны (max_redirects(0) в коде). Фаза 1 читает чистый MP3, без ICY.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# MP3-декодер: стриминговый probe → покадровый next_packet/decode (без Seek,
# в отличие от rodio::Decoder). Включены только MP3 и SIMD-оптимизации.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "opt-simd"] }
# Аудиовывод (rodio 0.23: DeviceSink + Player), конвертация формата
# источника в формат устройства. Декодеры rodio не нужны — источник
# сэмплов свой (pipeline.rs).
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# SIGINT/SIGTERM → атомарный флаг остановки (feature termination добавляет SIGTERM).
ctrlc = { version = "3.5", features = ["termination"] }
# Ошибки: derive Display/Error для enum'ов ошибок. Только compile-time
# (proc-macro), рантайм-зависимостей не добавляет; с фазой ICY число
# enum'ов вырастет — бойлерплейт ручных impl держим под нулём.
thiserror = "2"
# Разбор JSON внутри StreamTitle (ICY-метаданные): недоверенный и бывает
# обрезанным — самописный сканер повторял бы баг-поверхность библиотеки.
# Достаточно Value-доступа к полям, derive-фича serde не нужна.
serde_json = { version = "1", default-features = false, features = ["std"] }
# Окно плеера (design D4/D7 add-player-ui): дефолтные фичи — backend-winit
# + renderer-femtovg (на Linux), accessibility/system-tray осознанно
# принимаются; software-рендерер остаётся запасным через SLINT_BACKEND.
# Лицензия GPL-3.0/royalty-free — выбор «Rust + Slint» зафиксирован
# проектом для личного плеера. Разметка — ui/player-window.slint,
# компиляция — build.rs; lib от Slint не зависит, только bin.
slint = "1.18"
# Кодирование поисковой строки сервисов обложек (кириллица в query,
# design D1 add-album-art): минимальный RFC-3986-энкодер, крейт url
# с парсером не нужен.
percent-encoding = "2"
# Ключ кеша обложек (design D4 add-album-art): sha256("artist|title") —
# имя файла без коллизий и лимитов файловой системы. RustCrypto-хеш,
# рантайм-зависимость только из pure-Rust-ядра digest.
sha2 = "0.10"
# Декод JPEG-обложек в RGB8 для свойства-изображения окна (design D7
# add-album-art). Только jpeg: цепочка сервисов отдаёт JPEG. В итоговом
# дереве png присутствует унификацией со slint (нужен его @image-url
# для заглушки) — на это поведение декода не опираемся.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[build-dependencies]
# Компиляция .slint-разметки окна в build-скрипте (версия в sync с slint).
slint-build = "1.18"

# MPRIS-сервис на D-Bus (design D4 add-tray): интеграция плеера в
# KDE-аплет. Крейт async-only, но zbus 6 обслуживает соединение своим
# helper-потоком — встраивание без tokio: выделенный std::thread с
# mpris_server::zbus::block_on. Linux-only. Второй мажор zbus в дереве
# (5 — через ksni/slint) принят осознанно (design, риски). Дефолтные
# фичи выключены: tokio-интеграция не нужна.
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.11", default-features = false }
# Канал обновлений MPRIS-потока (design D4 add-tray): async-канал с
# waker'ом — селект с обработкой D-Bus-вызовов; уже в дереве через
# zbus/slint, своей копии не добавляет.
async-channel = "2"

[target.'cfg(target_os = "windows")'.build-dependencies]
# Вшивание иконки в exe-ресурс (фаза add-ci-release, build.rs): герб вместо
# дефолтной иконки rust-бинарника в проводнике и таскбаре. Только для
# Windows-таргета — Linux-сборка пакет не тянет; иконки окна и трея на Linux
# уже вшиты в бинарник Slint-компилятором из ui/app-icon.png.
winresource = "0.1"

[dev-dependencies]
# Property-based-тесты парсера ICY-метаблоков: скилл rust-clean-code
# прямо называет ICY-метаблоки целью PBT фазы 2 (инвариант кадрировщика,
# отсутствие паник парсера на произвольных байтах).
proptest = "1"

# Упаковка deb (фаза add-ci-release, `cargo deb`): бинарник + .desktop с
# иконкой из hicolor — приложение появляется в меню KDE/GNOME с гербом.
# Зависимости (libasound2 и пр.) cargo-deb вычисляет сам по линкуемым
# библиотекам; отдельный упакованный PNG дублирует ui/app-icon.png, потому
# что встроенная в бинарник иконка файловой системе не видна.
[package.metadata.deb]
section = "sound"
# Зависимости заданы явно: авто-режим cargo-deb с раннера Ubuntu 24.04 даёт
# libasound2t64 (пакет существует только в Ubuntu ≥24.04) и не видит
# библиотеки, загружаемые winit/x11-dl через dlopen (ldd их не показывает).
# libasound2 (без t64) выбран как имя, существенное и на Debian (на Ubuntu
# 24.04 резолвится через Provides). dlopen-часть графического стека (X11/GL)
# покрывается типичной графической сессией и в Depends не перечисляется.
depends = ["libasound2 (>= 1.2)", "libxkbcommon0", "libxkbcommon-x11-0", "libc6", "libfontconfig1"]
# Краткое описание для apt show: cargo-deb по умолчанию подставляет весь
# README, а сырой markdown (бейджи, заголовки) в терминале нечитаем.
extended-description = """\
Нативный плеер онлайн-радио «Говорит Севастополь»: живой MP3-стрим без
разрывов на обрывах сети, метаданные эфира (ICY) синхронно со звуком,
окно и трей, обложки трека. Документация — на GitHub (Homepage).\
"""
assets = [
    ["target/release/sevfm", "usr/bin/sevfm", "755"],
    ["packaging/sevfm.desktop", "usr/share/applications/sevfm.desktop", "644"],
    ["ui/app-icon.png", "usr/share/icons/hicolor/256x256/apps/sevfm.png", "644"],
]
